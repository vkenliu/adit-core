name: Deploy production

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact semver version to publish. Leave empty to bump npm latest patch."
        required: false
        type: string
      dry_run:
        description: "Validate and pack without publishing"
        required: true
        default: true
        type: boolean

jobs:
  publish-npm:
    name: Publish npm packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      REQUESTED_VERSION: ${{ inputs.version }}
      DRY_RUN: ${{ inputs.dry_run }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release version
        run: |
          node <<'NODE'
          const { execFileSync } = require("node:child_process");

          const requestedVersion = (process.env.REQUESTED_VERSION ?? "").trim();
          const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/;

          function validate(version) {
            if (semver.test(version)) return;

            console.error(`Invalid release version: ${version}`);
            console.error("Use an exact semver version, for example 0.4.14 or 0.5.0-beta.1.");
            process.exit(1);
          }

          function nextPatch(version) {
            const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(version);
            if (match === null) {
              console.error(`Cannot auto-bump non-stable npm latest version: ${version}`);
              console.error("Please run the workflow again and enter the version manually.");
              process.exit(1);
            }

            return `${match[1]}.${match[2]}.${Number(match[3]) + 1}`;
          }

          let version = requestedVersion;
          if (version === "") {
            try {
              const latest = execFileSync("npm", ["view", "@varveai/adit-cli@latest", "version"], {
                encoding: "utf8",
                stdio: ["ignore", "pipe", "pipe"],
              }).trim();

              if (latest === "") {
                throw new Error("npm returned an empty version");
              }

              version = nextPatch(latest);
              console.log(`Resolved release version from npm latest: ${latest} -> ${version}`);
            } catch (error) {
              console.error("Could not read @varveai/adit-cli@latest from npm.");
              console.error("Please run the workflow again and enter the version manually.");
              console.error(error instanceof Error ? error.message : String(error));
              process.exit(1);
            }
          }

          validate(version);

          console.log(`RELEASE_VERSION=${version}`);
          require("node:fs").appendFileSync(process.env.GITHUB_ENV, `RELEASE_VERSION=${version}\n`);
          NODE

      - name: Verify package versions are unpublished
        run: |
          set -euo pipefail

          node <<'NODE' > /tmp/adit-package-names.txt
          const { readFileSync } = require("node:fs");
          const packageJsonPaths = [
            "packages/core/package.json",
            "packages/engine/package.json",
            "packages/hooks/package.json",
            "packages/cli/package.json",
            "packages/cloud/package.json",
            "packages/plans/package.json",
          ];
          for (const path of packageJsonPaths) {
            console.log(JSON.parse(readFileSync(path, "utf8")).name);
          }
          NODE

          while IFS= read -r package_name; do
            if npm view "${package_name}@${RELEASE_VERSION}" version >/dev/null 2>&1; then
              echo "${package_name}@${RELEASE_VERSION} already exists on npm." >&2
              exit 1
            fi
          done < /tmp/adit-package-names.txt

      - name: Build packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Apply release package version
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");

          const version = process.env.RELEASE_VERSION;
          const internalPackageNames = new Set([
            "@varveai/adit-core",
            "@varveai/adit-engine",
            "@varveai/adit-hooks",
            "@varveai/adit-cli",
            "@varveai/adit-cloud",
            "@varveai/adit-plans",
          ]);
          const packageJsonPaths = [
            "packages/core/package.json",
            "packages/engine/package.json",
            "packages/hooks/package.json",
            "packages/cli/package.json",
            "packages/cloud/package.json",
            "packages/plans/package.json",
          ];

          for (const path of packageJsonPaths) {
            const packageJson = JSON.parse(readFileSync(path, "utf8"));
            packageJson.version = version;
            for (const field of ["dependencies", "peerDependencies", "optionalDependencies"]) {
              const dependencies = packageJson[field];
              if (dependencies === undefined) continue;

              for (const dependencyName of Object.keys(dependencies)) {
                if (internalPackageNames.has(dependencyName)) {
                  dependencies[dependencyName] = version;
                }
              }
            }
            writeFileSync(path, `${JSON.stringify(packageJson, null, 2)}\n`);
            console.log(`${packageJson.name}@${version}`);
          }
          NODE

      - name: Require npm token for publish
        if: ${{ inputs.dry_run == false }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "Missing NPM_TOKEN secret. Add an npm automation token as NPM_TOKEN." >&2
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish packages
        run: |
          set -euo pipefail

          publish_args=(
            "-r"
            "--access"
            "public"
            "--tag"
            "latest"
            "--no-git-checks"
            "--ignore-scripts"
          )

          if [ "${DRY_RUN}" = "true" ]; then
            publish_args+=("--dry-run")
          fi

          pnpm publish "${publish_args[@]}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
